<div class="min-h-screen flex items-center justify-center py-12 px-4 bg-dt-neutral-50">
  <div class="w-full max-w-sm">
    <div class="text-center mb-6">
      <img src="daltime-logo.png" alt="DalTime" class="h-16 w-auto mx-auto" />
      <h2 class="mt-4 text-2xl font-bold text-gray-900">Set New Password</h2>
      <p class="mt-2 text-sm text-gray-500">Your administrator created your account with a temporary password. Please set a new password to continue.</p>
    </div>

    <div class="bg-white rounded-xl shadow-sm border border-gray-200">
      <div class="p-6">
        @if (error()) {
          <div class="mb-4 rounded-lg border border-red-200 bg-red-50 px-4 py-2 text-sm text-red-800" data-testid="change-password-error">{{ error() }}</div>
        }

        <div class="mb-4">
          <label for="newPassword" class="block text-sm font-medium text-gray-700 mb-1">New Password</label>
          <div class="flex">
            <input
              [type]="showPassword() ? 'text' : 'password'"
              class="block flex-1 rounded-l-lg border border-r-0 border-gray-300 px-3 py-2.5 text-base shadow-sm focus:border-dt-secondary focus:outline-none focus:ring-1 focus:ring-dt-secondary"
              [class.input-error]="submitted() && !newPassword().trim()"
              id="newPassword"
              data-testid="new-password-input"
              [value]="newPassword()"
              (input)="newPassword.set($any($event.target).value)"
              placeholder="New password"
              autocomplete="new-password"
            />
            <button
              class="btn-dt-secondary rounded-l-none rounded-r-lg border border-dt-secondary px-3 text-sm"
              type="button"
              data-testid="toggle-password-btn"
              (click)="togglePassword()"
            >
              {{ showPassword() ? 'Hide' : 'Show' }}
            </button>
          </div>
          @if (submitted() && !newPassword().trim()) {
            <p class="input-feedback" data-testid="new-password-error">New password is required</p>
          }
        </div>

        <div class="mb-6">
          <label for="confirmPassword" class="block text-sm font-medium text-gray-700 mb-1">Confirm Password</label>
          <input
            [type]="showPassword() ? 'text' : 'password'"
            class="block w-full rounded-lg border border-gray-300 px-3 py-2.5 text-base shadow-sm focus:border-dt-secondary focus:outline-none focus:ring-1 focus:ring-dt-secondary"
            [class.input-error]="passwordsMismatch"
            id="confirmPassword"
            data-testid="confirm-password-input"
            [value]="confirmPassword()"
            (input)="confirmPassword.set($any($event.target).value)"
            (keydown.enter)="onSubmit()"
            placeholder="Confirm password"
            autocomplete="new-password"
          />
          @if (passwordsMismatch) {
            <p class="input-feedback" data-testid="mismatch-error">Passwords do not match</p>
          }
        </div>

        <app-button variant="primary" size="lg" [fullWidth]="true" [loading]="submitting()" testId="set-password-btn" (clicked)="onSubmit()">Set Password</app-button>
      </div>
    </div>
  </div>
</div>
